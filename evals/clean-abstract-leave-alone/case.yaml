schema_version: "1.1"
name: clean-abstract-leave-alone
expected_outcome: |
  The abstract is well formed: it states the problem, purpose, method, specific findings
  with numbers, and a conclusion hedged to the data. The review recognizes this, says that
  it finds no major problems, and does not invent missing moves, unsupported claims or
  vague quantities. Any suggestions are minor, optional and tied to specific wording, and
  the review stays short.
