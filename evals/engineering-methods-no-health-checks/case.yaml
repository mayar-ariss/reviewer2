schema_version: "1.1"
name: engineering-methods-no-health-checks
expected_outcome: |
  The review applies the Methods files (condensed versus extended detail; parts and order),
  notes that the mix optimization is reported without saying how it was done or against
  what criterion, and that no standard, specimen numbers or justification are given.
  Because the study is not health research, it does not apply the reporting-guideline or
  spin checks, and it may say they were not run for that reason.
