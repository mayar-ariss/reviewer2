schema_version: "1.1"
name: results-table-restated
expected_outcome: |
  The review finds that the commentary restates the table instead of commenting on it, that
  it does not highlight the result that matters (the much lower response rate in Nice), and
  that the exception is left unexplained. It cites the data commentary rules (restatement,
  highlighting, exceptions) and the Results file where relevant, and asks the author for the
  explanation of the Nice figure rather than supplying one.
