schema_version: "1.1"
name: flags-generic-aphorism
expected_outcome: |
  The review treats the sentence as an introduction opening and finds that it says little:
  it names no policy, no attitude, no measure and no population, and "how much" states no
  quantity. It cites rules from the introduction, informativeness, vagueness and/or
  unpacking files by file and number, and asks the author for the specific policies,
  attitudes or measures meant instead of inventing them.
