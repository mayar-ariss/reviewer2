schema_version: "1.1"
name: numbers-benchmark-digits
expected_outcome: |
  The review applies the numbers file. It flags 4.8372% as reported with more digits than a
  discharge measurement or model can support and asks what precision the data support; asks
  what "excellent" is judged against (a criterion, the uncertainty of the observations or
  earlier results) without supplying one; notes that "0.5 higher" has no unit and asks for
  it; and says that p = 0.04 indicates statistical significance, not a large or important
  effect, so "proves" and "large effect" do not follow. It also asks which event and gauge
  the peak refers to. It invents no unit, benchmark or precision.
